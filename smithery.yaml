# Smithery: hosted remote server (Streamable HTTP). No local build.
runtime: "external"
remote:
  url: "https://siteverify.dev/mcp"
  transport: "streamable-http"
startCommand:
  type: http
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "fv_live_ key (optional; get one free with verify_signup or at /get-key)"
