[build]
builder = "NIXPACKS"
buildCommand = "cd ../.. && corepack enable && pnpm install && pnpm --filter @6frame/config build && pnpm --filter @6frame/contracts build && pnpm --filter @6frame/evaluators build && pnpm --filter @6frame/worker build && cd apps/worker && npx playwright install chromium --with-deps || true"
watchPatterns = ["apps/worker/**", "packages/**"]

[deploy]
startCommand = "node apps/worker/dist/index.js"
restartPolicyType = "ON_FAILURE"
